[project]
name = "data-engineer-course"
version = "1.0.0"
description = "Material y ejemplos del Curso Modular de Ingeniería de Datos"
requires-python = ">=3.11,<3.14"
dependencies = [
  "click>=8.1,<9",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "SQLAlchemy>=2,<3",
]

[dependency-groups]
dev = [
  "black>=25.1,<26",
  "flake8>=7.1,<8",
  "ipykernel>=6.29,<7",
  "mypy>=1.14,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-nbval>=0.11,<1",
  "ruff>=0.9,<1",
]
notebooks = [
  "aiohttp>=3.11,<4",
  "beautifulsoup4>=4.12,<5",
  "cachetools>=5.5,<7",
  "fastapi>=0.115,<1",
  "fastparquet>=2024.11,<2027",
  "great-expectations>=1.0,<2",
  "httpx>=0.28,<1",
  "ipython>=8.31,<10",
  "jupyterlab>=4.3,<5",
  "loguru>=0.7,<1",
  "lxml>=5.3,<7",
  "matplotlib>=3.9,<4",
  "notebook>=7.3,<8",
  "openpyxl>=3.1,<4",
  "pandera[pandas]>=0.22,<1",
  "plotly>=5.24,<7",
  "pyarrow>=18,<26",
  "pydantic>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "python-dotenv>=1,<2",
  "pytz>=2024.2",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "structlog>=24.4,<26",
  "tqdm>=4.67,<5",
  "uvicorn>=0.34,<1",
]
cloud-aws = ["boto3>=1.35,<2"]
cloud-gcp = [
  "google-cloud-bigquery>=3.27,<4",
  "google-cloud-storage>=2.19,<4",
]
cloud-azure = [
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "azure-storage-file-datalake>=12.18,<13",
]
databases = [
  "duckdb>=1.1,<2",
  "psycopg2-binary>=2.9,<3",
  "pymongo>=4.10,<5",
  "redis>=5.2,<7",
]
airflow = ["apache-airflow>=3.3,<3.4"]
spark = ["delta-spark>=4,<5", "pyspark>=4,<5"]
genai = [
  "chromadb>=1,<2",
  "faiss-cpu>=1.9,<2",
  "google-genai>=1,<2",
  "langchain>=1,<2",
  "langchain-community>=0.4,<1",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "openai>=2,<3",
  "sentence-transformers>=3,<7",
  "tiktoken>=0.8,<1",
]
all = [
  { include-group = "notebooks" },
  { include-group = "cloud-aws" },
  { include-group = "cloud-gcp" },
  { include-group = "cloud-azure" },
  { include-group = "databases" },
  { include-group = "spark" },
  { include-group = "genai" },
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
markers = ["slow: tests that exercise slower end-to-end paths"]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = []
